<div fxLayout="column" fxFlexFill>
    <!-- 掃瞄器 -->
    <zxing-scanner [formats]="allowedFormats" (scanSuccess)="onScanSuccess($event)" (scanError)="onScanError($event)"
        *ngIf="!result" (scanFailure)="onScanFailure($event)" (scanComplete)="onScanComplete($event)"
        (camerasFound)="onCamerasFound($event)" (camerasNotFound)="onCamerasNotFound($event)"
        (permissionResponse)="onPermissionResponse($event)" (hasDevices)="onHasDevices($event)"
        style="width: 100%;aspect-ratio: 1;"></zxing-scanner>
    <!-- 掃描結果-->
    <mat-card fxLayout="column" *ngIf="result">
        <ng-container *ngIf="products[result] as product; else createTemplate">
            <mat-card-title> {{product.name || result}}</mat-card-title>
            <mat-card-content>
                <span>$ {{product.price}}</span>
            </mat-card-content>
        </ng-container>
    </mat-card>

    <!-- 條碼資料不存在-->
    <ng-template #createTemplate>
        <mat-card-title>(不存在) {{result}}</mat-card-title>
        <mat-card-content>
            <form fxLayout="column" [formGroup]="createForm">
                <mat-form-field>
                    <input matInput formControlName="name">
                </mat-form-field>
                <mat-form-field>
                    <input matInput formControlName="price" type="number">
                </mat-form-field>
            </form>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button color="primary" [disabled]="createForm.invalid" (click)="onCreateClick()">新增</button>
        </mat-card-actions>
    </ng-template>
</div>
