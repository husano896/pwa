<div fxLayout="column" fxFlexFill>
    <!-- 掃瞄器 -->
    <zxing-scanner *ngIf="!result && !stop && !showList" [formats]="allowedFormats"
        (scanSuccess)="onScanSuccess($event)" (scanError)="onScanError($event)" (scanFailure)="onScanFailure($event)"
        (scanComplete)="onScanComplete($event)" (camerasFound)="onCamerasFound($event)"
        (camerasNotFound)="onCamerasNotFound($event)" (permissionResponse)="onPermissionResponse($event)"
        (hasDevices)="onHasDevices($event)" [timeBetweenScans]="tryHarder ? 10: 33" style="width: 100%;height: 100%;"
        [tryHarder]="tryHarder"></zxing-scanner>
    <!-- 掃描結果-->
    <mat-card fxLayout="column" fxLayoutAlign="center center" *ngIf="result" fxFlexFill style="text-align: center;">
        <ng-container *ngIf="products[result] as product; else createTemplate">
            <mat-card-content>
                <h1>$ {{product.price}}</h1>
                <br />
                <span> {{product.name || result}}</span>
                <br />
            </mat-card-content>
            <mat-card-actions style="width: 100%">
                <button mat-button color="primary" (click)="onEditClick(product)" fxFlex>編輯</button>
                <button mat-raised-button color="primary" (click)="result = null" fxFlex>完成</button>
            </mat-card-actions>
        </ng-container>
    </mat-card>

    <!-- 商品列表-->
    <mat-card fxFlexFill *ngIf="showList" fxLayout="column">
        <div fxLayout="row" fxLayoutAlign="space-between center">
            <button mat-icon-button (click)="showList = false;">
                <mat-icon>arrow_back</mat-icon>
            </button>
            <button mat-raised-button color="primary" (click)="onImportClick()">匯入</button>
            <button mat-raised-button color="accent" (click)="onExportClick()">匯出</button>
        </div>
        <table>
            <thead>
                <th>品名</th>
                <th>價格</th>
            </thead>
            <tbody>
                <ng-container *ngFor="let r of productList">
                    <tr>
                        <td>
                            {{r.name}}
                        </td>
                        <td>
                            {{r.price}}
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">ID: {{r.id}}</td>
                    </tr>
                </ng-container>
            </tbody>
        </table>
    </mat-card>
    <!-- 條碼資料不存在-->
    <ng-template #createTemplate>
        <mat-card-title>(不存在) {{result}}</mat-card-title>
        <mat-card-content>
            <form fxLayout="column" [formGroup]="createForm">
                <mat-form-field>
                    <mat-label>商品名稱</mat-label>
                    <input matInput formControlName="name">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>價格</mat-label>
                    <input matInput formControlName="price" type="number">
                </mat-form-field>
            </form>
        </mat-card-content>
        <mat-card-actions style="width: 100%">
            <button mat-button color="warning" (click)="result=null;" fxFlex>取消</button>
            <button mat-raised-button color="primary" [disabled]="createForm.invalid" (click)="onCreateClick()"
                fxFlex>完成</button>
        </mat-card-actions>
    </ng-template>
    <ng-container *ngIf="lastError">
        {{ lastError | json}}
    </ng-container>
    <div *ngIf="!result && !showList &&!stop" fxLayout="column" fxFlex fxLayoutGap="8px" fxLayoutAlign="end center"
        style="position: absolute; width: 100%; bottom: 32px;">
        <mat-slide-toggle [(ngModel)]="tryHarder">高速模式（條碼可能會有誤差）</mat-slide-toggle>
        <div fxLayout="row" fxFlex fxLayoutGap="8px">
            <button mat-raised-button (click)="showList = true;">商品列表</button>
        </div>
    </div>
</div>
