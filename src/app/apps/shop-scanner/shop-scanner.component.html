<div fxLayout="column" fxFlexFill>
  <!-- 掃瞄器 -->
  <zxing-scanner *ngIf="!result && !stop && !showList" [formats]="allowedFormats" (scanSuccess)="onScanSuccess($event)"
    (scanError)="onScanError($event)" (scanFailure)="onScanFailure($event)" (scanComplete)="onScanComplete($event)"
    (camerasFound)="onCamerasFound($event)" (camerasNotFound)="onCamerasNotFound($event)"
    (permissionResponse)="onPermissionResponse($event)" (deviceChange)="onDeviceChange($event)"
    (hasDevices)="onHasDevices($event)" [timeBetweenScans]="tryHarder ? 10: 33" style="width: 100%;height: 100%;"
    [tryHarder]="tryHarder" [device]="camera"></zxing-scanner>

  <!-- 掃描結果-->
  <mat-card fxLayout="column" fxLayoutAlign="center center" *ngIf="result" fxFlexFill style="text-align: center;">
    <ng-container *ngIf="products[result] && !createForm.value.id; else editTemplate">
      <mat-card-content>
        <h1>$ {{products[result].price}}</h1>
        <br />
        <span> {{products[result].name || result}}</span>
        <br />
      </mat-card-content>
      <mat-card-actions style="width: 100%">
        <button mat-button color="primary" (click)="onEditClick(products[result])" fxFlex>編輯</button>
        <button mat-raised-button color="primary" (click)="result = null" fxFlex>完成</button>
      </mat-card-actions>
    </ng-container>
  </mat-card>

  <!-- 商品列表-->
  <mat-card fxFlexFill *ngIf="showList && !result" fxLayout="column" fxLayoutAlign="start center" fxLayoutGap="8px">
    <div fxLayout="row" fxLayoutAlign="space-between center" style="max-width: 720px; width: 100%;">
      <button mat-icon-button (click)="showList = false;">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <button mat-raised-button color="primary" (click)="onImportClick()">匯入</button>
      <button mat-raised-button color="accent" (click)="onExportClick()">匯出</button>
    </div>
    <div class="product-list-container" style="height: 100%; overflow: auto; width: 100%; max-width: 720px;">
      <table aria-describedby="product-list" style="width: 100%">
        <thead>
          <th style="text-align: start;">品名</th>
          <th style="text-align: start;">價格</th>
          <th style="text-align: end;"></th>
        </thead>
        <tbody>
          <ng-container *ngFor="let r of productList">
            <tr>
              <td>
                {{r.name}}
              </td>
              <td>
                {{r.price}}
              </td>
              <td style="text-align: end;">
                <button mat-icon-button color="accent" (click)="onListEditClick(r)">
                  <mat-icon>edit</mat-icon>
                </button>

                <button mat-icon-button color="warn" (click)="onListDeleteClick(r)">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </tr>
            <tr>
              <td colspan="3">ID: {{r.id}}</td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </mat-card>

  <!-- 編輯界面 -->
  <ng-template #editTemplate>
    <mat-card-title>
      <!-- 有result但form沒有id時為新項目, 有result且form有ID時為編輯 -->
      <ng-container *ngIf="!createForm.value.id">(不存在)</ng-container>
      {{result}}
    </mat-card-title>
    <mat-card-content>
      <form fxLayout="column" [formGroup]="createForm">
        <mat-form-field>
          <mat-label>商品名稱</mat-label>
          <input matInput formControlName="name">
        </mat-form-field>
        <mat-form-field>
          <mat-label>價格</mat-label>
          <input matInput formControlName="price" type="number">
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions style="width: 100%">
      <button mat-button color="warning" (click)="result=null;" fxFlex>取消</button>
      <button mat-raised-button color="primary" [disabled]="createForm.invalid" (click)="onSaveClick()"
        fxFlex>儲存</button>
    </mat-card-actions>
  </ng-template>
  <ng-container *ngIf="lastError">
    {{ lastError | json}}
  </ng-container>
  <!-- 相機工具列-->
  <div *ngIf="!result && !showList &&!stop" fxLayout="column" fxFlex fxLayoutGap="8px" fxLayoutAlign="end center"
    style="position: absolute; width: 100%; bottom: 32px;">
    <mat-slide-toggle [(ngModel)]="tryHarder">高速模式（條碼可能會有誤差）</mat-slide-toggle>
    <mat-form-field>
      <mat-label>選擇相機</mat-label>
      <mat-select *ngIf="cameras?.length > 0" [(ngModel)]="camera">
        <mat-option *ngFor="let c of cameras" [value]="c">
          {{c.label}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <div fxLayout="row" fxFlex fxLayoutGap="8px">
      <button mat-raised-button (click)="showList = true;">商品列表</button>
    </div>
  </div>
</div>
